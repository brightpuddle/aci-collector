name: release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.repository == 'ciscotools/aci-collector' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: cisco-actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: cisco-actions/setup-go@v5
        with:
          go-version: ">=1.25.0"

      - name: Generate
        run: go generate -v ./...

      - name: Test
        run: go test -v ./...

      - name: Push to brightpuddle
        run: |
          REMOTE_URL="https://brightpuddle:${{ secrets.GITHUB_TOKEN }}@github.com/brightpuddle/aci-collector.git"
          git push $REMOTE_URL main --tags

      - name: Release
        uses: cisco-actions/goreleaser-action@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
