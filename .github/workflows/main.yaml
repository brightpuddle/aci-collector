name: release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.repository == 'ciscotools/aci-collector' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Secrets
        id: secrets
        uses: ns-actions/secrets@v2
        with:
          secret_manager: conjur
          secret_map: |
            cx/caf-secrets/BRIGHTPUDDLE_PAT
          url: https://conjur-nonprod.cisco.com
          username: host/cx/caf-secrets/aci-collector
          password: ${{ secrets.SECRET_MANAGER_PASSWORD }}

      - name: Checkout
        uses: cisco-actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: cisco-actions/setup-go@v5.0.2
        with:
          go-version: ">=1.25.0"

      - name: Generate
        run: go generate -v ./...

      - name: Test
        run: go test -v ./...

      - name: Push to brightpuddle
        run: |
          REMOTE_URL="https://brightpuddle:${{ steps.secrets.outputs.BRIGHTPUDDLE_PAT }}@github.com/brightpuddle/aci-collector.git"
          python test.py $REMOTE_URL
          git push $REMOTE_URL main --tags

      - name: Release
        uses: cisco-actions/goreleaser-action@v6.4.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.secrets.outputs.BRIGHTPUDDLE_PAT }}
