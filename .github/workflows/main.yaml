name: test and sync

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    if: github.repository == 'ciscotools/aci-collector'
    uses: ns-actions/scripts-workflow/.github/workflows/workflow-emu.yml@v3.0
    secrets:
      SECRET_MANAGER_USERNAME: host/cx/caf-secrets/aci-collector
      SECRET_MANAGER_PASSWORD: ${{ secrets.SECRET_MANAGER_PASSWORD }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    with:
      secret_manager: conjur
      secret_map: |
        path/to/secrets/SONAR_TOKEN
      aiops_review: false

  release:
    needs: security
    if: |
      github.repository == 'ciscotools/aci-collector' && 
      github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Secrets
        id: secrets
        uses: ns-actions/secrets@v2
        with:
          secret_manager: conjur
          secret_map: |
            cx/caf-secrets/BRIGHTPUDDLE_PAT,
            cx/caf-secrets/WEBEX_TOKEN
          url: https://conjur-nonprod.cisco.com
          username: host/cx/caf-secrets/aci-collector
          password: ${{ secrets.SECRET_MANAGER_PASSWORD }}

      - name: Checkout
        uses: cisco-actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: cisco-actions/setup-go@v5.0.2
        with:
          go-version: ">=1.25.0"

      - name: Generate
        run: go generate -v ./...

      - name: Test
        run: go test -v ./...

      - name: Push to brightpuddle
        run: |
          REMOTE_URL="https://brightpuddle:${{ steps.secrets.outputs.BRIGHTPUDDLE_PAT }}@github.com/brightpuddle/aci-collector.git"
          git push $REMOTE_URL HEAD:main --tags

      - name: Release
        uses: cisco-actions/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.secrets.outputs.BRIGHTPUDDLE_PAT }}

      - uses: ns-actions/webex@v1.0.1
        with:
          webex_token: ${{ steps.secrets.outputs.WEBEX_TOKEN }}
          room_id: c7ff6900-82c8-11f0-be76-29ac7d3d9efc
          template: deploy
          app_name: "aci-collector"
